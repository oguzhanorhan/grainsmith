# ===================== grainsmith run configuration =====================
# HUGE TIER — Pd90-Au10, perturbed-distance (self-affine) grain boundaries
# in a 1500 A cube. ~2.3e8 atoms, 256 grains (~29 nm). Cluster job, not a
# laptop job: see RESOURCES below before submitting.
#
# This is the box-expanded sibling of adv_pdau_perturbed.yaml (246 A,
# 28 grains, ~1e6 atoms). Same physics, same literature grounding; what
# changes is scale, and scale changes three parameters in ways that are NOT
# a simple multiplication. All three are worked out below rather than
# scaled by eye, because getting any of them wrong produces a run that
# either aborts after an hour or silently under-resolves the boundary.
#
# 1. THE ANALYSIS GRID CAPS OUT, SO l_min HAS TO RISE.
#    The self_affine grid heuristic asks for h = l_min/4 per axis but is
#    capped at VOXEL_GRID_MAX = 384 voxels/axis. At 246 A that cap is not
#    binding; at 1500 A it is, hard:
#        h_field = 1500 / 384 = 3.906 A
#    The field cannot represent a wavelength below the Nyquist floor
#    2*h_field = 7.81 A. The small example's l_min = 12.0 A clears that,
#    but l_min = 2*d_nn = 5.53 A -- the value the smaller self_affine
#    examples in examples/self_affine_gb/ use -- does not.
#    This file uses l_min = 9.0 A, a +15.2% margin.
#
#    WORTH KNOWING BEFORE YOU QUEUE A JOB: this check is NOT part of
#    `grainsmith validate`. The config layer cannot evaluate it, because
#    the grid is only resolved when the tessellation is built -- so a
#    too-small l_min passes validate and then raises minutes into the run
#    (tessellation/perturbed.py, "below 2*h_field ... Nyquist"). The
#    amplitude ceiling below, by contrast, IS caught at resolve time.
#    Raising the box further does not help: the cap is per-axis, so h_field
#    grows linearly with the edge and l_min must grow with it.
#
# 2. GRAIN COUNT IS A MEMORY PARAMETER, NOT ONLY A PHYSICS ONE.
#    fill_grain enumerates a lattice box around each grain whose volume
#    scales as (bounding radius)^3 ~ box^3 / n_grains. Holding the small
#    example's 28 grains at 1500 A would put ~3.4e8 lattice points -- tens
#    of GB -- in EVERY fill worker at once. At 256 grains the per-grain
#    grid is ~5.9e6 points (~0.43 GB transient), so 32 workers need ~14 GB
#    between them. 256 grains also lands d_eq = 29.3 nm, still inside the
#    nanocrystalline regime this example is about.
#
# 3. THE AMPLITUDE CEILING MOVES WITH THE GRAIN SIZE.
#    The seed-containment guard caps the perturbation at
#    a_max = PERTURBED_DISTANCE_SAFETY * min_seed_distance / (2*ETA_CLIP)
#          = 0.5 * 146.55 / 6 = 12.212 A
#    (vs 4.19 A at the small example's 28 grains in a 246 A box, whose
#    min_seed_distance resolves to r_ws = 50.26 A). This file
#    uses 10.38 A = 85% of that ceiling.
#
# GEOMETRY (computed from the installed code, not quoted from memory)
# -------------------------------------------------------------------
#   * N = 256 grains in a 1500.0 A cube -> r_ws = (3V/(4*pi*N))^(1/3)
#     = 146.55 A, i.e. d_eq = 2*r_ws = 29.3 nm. min_seed_distance: auto
#     resolves to that same r_ws.
#   * Pd90Au10 FCC, Vegard a = 3.909 A -> 4 atoms/cell, d_nn = 2.7641 A.
#     226 million atoms before overlap removal.
#   * l_min = 9.0 A (see 1 above), l_max = 146.5 A ~= r_ws and well under
#     the hard cap min(L)/2 = 750 A. Band = log2(146.5/9.0) = 4.02 octaves.
#   * amplitude 10.38 A, `total_rms` convention: the number IS the total
#     RMS of the perturbation field, directly comparable to a_max.
#
# RESOURCES (read before submitting)
# ----------------------------------
#   * Atoms alone: 226e6 x 36 B = 8.1 GB for the position/species/grain
#     arrays. The peak is NOT that number -- the post-fill sort holds the
#     old and new arrays plus an index simultaneously, ~18 GB, and the
#     writers add their own buffers. Budget a node with >= 64 GB and do not
#     be surprised by 30-40 GB resident.
#   * runtime.memory_limit_gb below bounds any SINGLE allocation and is
#     what the parallel fill divides by the worker count when it decides
#     how many workers actually fit. It is not a total-RSS cap.
#   * Self-affine field workspace: one float32 384^3 field is 0.23 GB and
#     the graph colouring needs one per colour (order 10-30 at this grain
#     count), converted one colour at a time.
#   * Wall time is dominated by the fill and the overlap search. Use
#     --jobs 32 or so; more workers mainly buy fill throughput, and each
#     one costs another lattice grid.
#
# Run (SLURM sketch in examples/hpc/job.sbatch):
#   grainsmith validate examples/advanced/huge_pdau_perturbed.yaml
#   grainsmith generate examples/advanced/huge_pdau_perturbed.yaml --jobs 32
# =========================================================================

meta:
  title: "HUGE: Pd90-Au10, self-affine perturbed-distance GBs, 1500 A box, 256 grains"
  verbose: 1

runtime:
  # Per-ALLOCATION guard. The largest single arrays here are the 384^3
  # analysis grid and one self-affine colour field (~0.23 GB each) and the
  # concatenated atom arrays (~8 GB); 32 GB clears all of them with room
  # and still fails fast on a mistyped parameter. Lower it to throttle the
  # fill pool: the driver clamps the worker count so that
  # workers x per-grain grid stays inside this budget and free RAM.
  memory_limit_gb: 32.0

seed:
  mode: fixed
  value: 105102

box:
  lengths: [1500.0, 1500.0, 1500.0]
  periodic: [true, true, true]
  vacuum: 0.0

grains:
  number: 256                 # -> d_eq 29.3 nm; also the memory knob (see 2)
  min_seed_distance: auto     # -> r_ws = 146.55 A
  lloyd_iterations: 0

crystal:
  space_group:
    number: 225               # Fm-3m (FCC)
  lattice:
    a: 3.909                  # Vegard Pd(3.8907)/Au(4.0782) at 90/10 at.%
  wyckoff_sites:
    - element: {Pd: 0.90, Au: 0.10}   # random solid solution on the 4a site
      coords: [0.0, 0.0, 0.0]
      letter: a

orientation:
  scheme: random_uniform

boundaries:
  geometry: curved
  curved:
    method: perturbed_distance
    spectrum: self_affine
    hurst: 0.7                # as in the 1e6-atom sibling
    amplitude: 10.38          # A, total RMS; 85% of a_max = 12.212 A
    l_min: 9.0                # >= 2*h_field = 7.81 A, +15.2% margin (see 1)
    l_max: 146.5              # ~= r_ws; <= min(L)/2 = 750 A
  overlap_removal:
    enabled: true
    cutoff: "0.85*d_nn"
    policy: delete_shallower  # multi-species alloy: midpoint_merge forbidden

analysis:
  voxel_grid: auto            # -> 384^3 (the per-axis cap, see 1)
  gb_character: true
  csl: false                  # random texture: no meaningful CSL population
  per_atom_margin: false      # 226e6 extra float64 would cost another 1.8 GB
  statistics: true
  section: {axis: z, position: 0.5}

output:
  directory: ./out_huge_pdau_perturbed
  lammps:
    filename: polycrystal.data
    atom_style: molecular     # molecule-id = grain id (OVITO grain colouring)
  xyz:
    enabled: true
    filename: polycrystal.extxyz
  csv:
    grains: grains.csv
    boundaries: boundaries.csv
    vertices: vertices.csv
    summary: summary.csv
  gnuplot:
    enabled: true
  mesh:
    enabled: false            # a 384^3 marching-cubes mesh at this scale is
                              # not a useful artifact; use the voxel grid
  methods_snippet: true
