# ===================== grainsmith run configuration =====================
# ADVANCED example (~1M atoms) — the experimentally-grounded flagship.
# Nanocrystalline Pd90-Au10 with PERTURBED-DISTANCE (level-set) self-affine
# grain boundaries.
#
# WHY perturbed_distance AND NOT warp: `warp` is a coordinate DIFFEOMORPHISM
# (grain_of(x) = base.grain_of(x + u(x)), bijective under guard G6) — a
# bijective map cannot change the box-counting dimension of the surface it
# displaces, so it cannot produce a genuinely self-affine boundary regardless
# of the Hurst exponent (see docs/physics.md §5b for the full argument).
# `perturbed_distance` perturbs the ASSIGNMENT RULE itself rather than the
# coordinate frame, so it is NOT a diffeomorphism and its as-built
# boundary's own box-counting dimension genuinely responds to hurst.
#
# WHAT THIS TEACHES
#   * boundaries.curved.method: perturbed_distance — grain membership is
#         grain_of(x) = argmin_i [ d_pbc(x, s_i) - amplitude * eta_i(x) ]
#     with an INDEPENDENT per-grain scalar field eta_i (same
#     spectrum/hurst/l_min/l_max/amplitude keys `warp` also declares,
#     reused verbatim). See examples/self_affine_gb/pdau_perturbed_self_affine.yaml
#     for the smaller (~5e5-atom) worked example this file scales up, and
#     docs/geometry.md section 4b for the full parameter reference.
#   * Experimental motivation (unchanged from this file's warp-based
#     predecessor). Braun et al. report a novel abnormal grain growth in
#     inert-gas-condensed nanocrystalline Pd_90 Au_10 in which the growing
#     grains develop dendritic, highly convoluted boundaries whose 2D
#     section PERIMETER has a box-counting fractal dimension
#     D_b ~= 1.2 (mean 1.174 +/- 0.004 over 57 grains; an earlier study
#     gave 1.20(1)) — versus D_b ~= 1.03 for conventionally cast, smooth
#     boundaries [Braun 2018, Sci. Rep. 8:1592; Braun 2020,
#     J. Appl. Phys. 128:105102].
#   * G6 (warp bijectivity) does NOT apply here — there is no coordinate
#     map to check invertibility of. Instead: a seed-containment guard
#     (amplitude <= 0.5*min_seed_distance/(2*ETA_CLIP), i.e.
#     min_seed_distance/12) is checked at config-resolve time, and an
#     EXACT seed-ownership check runs at construction (every grain's own
#     seed must still map to itself under the perturbed rule) — see
#     docs/gates.md G6 note and docs/physics.md §5b. This file's amplitude
#     (4.0 A) is ~95% of THIS geometry's own ceiling A_max =
#     min_seed_distance/12 ~= 4.19 A (28 grains, 246 A box).
#   * G5 (connectivity) is a REPAIR-AND-REPORT gate for this method, not
#     a hard failure: any voxel-scale fragmentation the level-set folding
#     produces is repaired by majority-vote reassignment, and gate G19
#     (warn-only) reports what fraction of voxels needed it. Gate G20
#     (warn-only) reports the box-counting D_b estimate itself, the G13
#     analogue for this method — see docs/gates.md. Gate G13 (warn) still
#     back-estimates the Hurst exponent from the radially averaged PSD of
#     the synthesized per-grain fields (moved here from warp; warp no
#     longer ever triggers G13).
#   * HONEST CALIBRATION STATUS (read before treating this as a turnkey
#     D_b=1.174 generator — see examples/self_affine_gb/pdau_perturbed_self_affine.yaml's
#     own note for the full sweep this is based on). A dedicated H-amplitude
#     sweep on a 60-grain/300 A test geometry found the box-counting D_b
#     estimate rises MONOTONICALLY with amplitude at every Hurst tested,
#     saturating around D_b ~= 1.11-1.12 near the seed-containment safety
#     ceiling — inside Braun's reported per-grain RANGE (1.10-1.24) but
#     only at its LOWER edge, short of the 1.174 mean. THIS FILE, run
#     end-to-end at its actual ~1M-atom scale (`grainsmith generate
#     examples/advanced/adv_pdau_perturbed.yaml --jobs 0`, 31.5 s
#     wall on a 32 GB/24-core laptop): 948,516 atoms, 28 grains, 217 boundaries,
#     13/13 QA gates passed; summary.csv reports hurst_estimated = 0.704
#     (target 0.70, |dev| = 0.004), d_b_estimated = 1.118, and
#     reassigned_fraction = 0.082%. This is consistent with (slightly
#     above) the 60-grain calibration sweep's own ceiling reading — inside
#     Braun's per-grain range, still short of the 1.174 mean. Reaching the
#     upper part of the Braun band with a larger safety margin is open
#     follow-up work, not something this example claims.
#   * Chemistry: a Pd/Au random FCC solid solution on the single 4a site
#     (element: {Pd: 0.90, Au: 0.10}); gate G9 re-measures the achieved
#     composition after overlap cleanup. The alloy motivates
#     delete_shallower (never midpoint_merge, which is forbidden for
#     multi-species systems because merging a Pd-Au pair would silently
#     shift the composition).
#   * Scale: ~1e6 atoms in a 246^3 A (~24.6 nm) fully periodic cell with
#     28 grains -> ~10 nm mean equivalent-sphere grain size, the nano-
#     crystalline regime of the reference material.
#
# HOW TO RUN
#   grainsmith validate examples/advanced/adv_pdau_perturbed.yaml
#   grainsmith generate examples/advanced/adv_pdau_perturbed.yaml --jobs 0
#   Check summary.csv for hurst_estimated / d_b_estimated / reassigned_fraction
#   (gates G13, G19, G20) and slice_z0.5.csv for the EBSD-like midplane cut.
#
# NOTE ON THE MODEL: grainsmith reproduces a GEOMETRY inspired by the
# reference measurement (a perturbed-distance self-affine interface, honestly
# bounded against the Braun D_b band per the calibration note above), not
# the grain-growth KINETICS that produce self-affine boundaries in the
# experiment. It is a starting structure for MD, not a coarsening
# simulation.

meta:
  title: "Pd90-Au10 nanocrystalline, perturbed-distance (self-affine) GBs, H=0.7, ~1M atoms"
  verbose: 1

seed:
  mode: fixed
  value: 105102               # nod to J. Appl. Phys. 128:105102 (Braun 2020)

box:
  lengths: [246.0, 246.0, 246.0]   # ~24.6 nm cube; ~1e6 atoms of Pd90Au10
  periodic: [true, true, true]
  vacuum: 0.0

grains:
  number: 28                 # -> ~10 nm mean equiv-sphere diameter (NC regime)
  min_seed_distance: auto
  lloyd_iterations: 0

crystal:
  space_group:
    number: 225              # Fm-3m (FCC)
  lattice:
    a: 3.909                 # Vegard Pd(3.8907)/Au(4.0782) at 90/10 at.%, A
  wyckoff_sites:
    - element: {Pd: 0.90, Au: 0.10}   # random solid solution on the 4a site
      coords: [0.0, 0.0, 0.0]
      letter: a

orientation:
  scheme: random_uniform

boundaries:
  geometry: curved
  curved:
    method: perturbed_distance
    spectrum: self_affine
    amplitude: 4.0              # A; ~95% of this geometry's seed-containment
                                 # ceiling A_max = min_seed_distance/12 (~4.19 A
                                 # here) — see the calibration note above.
    hurst: 0.7                  # typical metal GB range (schema default band
                                 # 0.7-0.9); H's effect on D_b is weak relative
                                 # to amplitude (see calibration note above).
    l_min: 12.0                 # >= 2*h_field for the resolved grid
    l_max: 40.0                 # <= min(L)/2 = 123 A
  overlap_removal:
    enabled: true
    cutoff: "0.85*d_nn"
    policy: delete_shallower   # midpoint_merge would raise: multi-species

analysis:
  voxel_grid: auto
  gb_character: true
  csl: false                 # cubic, but Sigma labels are not the point here
  per_atom_margin: false
  statistics: true           # statistics.csv + microstructure.json
  section: {axis: z, position: 0.5}   # EBSD-like midplane slice for MTEX

output:
  directory: ./out_adv_pdau_perturbed
  lammps:
    filename: polycrystal.data
    atom_style: molecular
  xyz:
    enabled: true
    filename: polycrystal.extxyz
  csv:
    grains: grains.csv
    boundaries: boundaries.csv
    vertices: vertices.csv
    summary: summary.csv
  gnuplot:
    enabled: true
  mesh:
    enabled: false
