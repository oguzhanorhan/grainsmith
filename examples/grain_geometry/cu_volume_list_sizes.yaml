# ===================== grainsmith run configuration =====================
# FCC Cu with an EXPLICIT per-grain volume list (size_distribution:
# volumes) — a bimodal 3:1 microstructure.
#
# WHAT THIS TEACHES
#   * grains.size_distribution.type: volumes — you prescribe every
#     grain's volume yourself. The `volumes:` list gives RELATIVE volumes
#     (normalized internally so they sum to V_box); its length must equal
#     grains.number and every entry must be positive (cross-field
#     Rule 11, checked at G1). Here 4 large + 4 small grains at 3:1 make
#     a bimodal structure: volume fractions 3/16 = 0.1875 and
#     1/16 = 0.0625.
#   * The COMMON SLIP this example exists to prevent: `type:` (and
#     `volumes:`) live INSIDE the `size_distribution:` block — writing
#     them directly under `grains:` is rejected by gate G1 with
#     "Extra inputs are not permitted".
#   * Gate G11 re-measures the final power cells against the prescribed
#     list (hard, vol_tol); grains.csv's volume_fraction column shows the
#     achieved bimodal split, and the equivalent-diameter ratio is
#     3^(1/3) ≈ 1.44.
#   * Same machinery as the log-normal and equal siblings
#     (cu_lognormal_sizes.yaml, cu_equal_sizes.yaml) — only the target
#     sampling differs.
#
# HOW TO RUN
#   grainsmith validate examples/grain_geometry/cu_volume_list_sizes.yaml
#   grainsmith generate examples/grain_geometry/cu_volume_list_sizes.yaml
#   Check grains.csv volume_fraction (four ≈ 0.1875, four ≈ 0.0625) and
#   summary.csv's size_distribution section.

meta:
  title: "FCC Cu, 8 grains, explicit bimodal volume list (SDOT-fitted)"
  verbose: 1

seed:
  mode: fixed
  value: 192023

box:
  lengths: [60.0, 60.0, 60.0]
  periodic: [true, true, true]
  vacuum: 0.0

grains:
  number: 8
  min_seed_distance: auto
  lloyd_iterations: 0
  size_distribution:
    type: volumes
    volumes: [3, 3, 3, 3, 1, 1, 1, 1]   # relative; normalized to V_box
    vol_tol: 1.0e-3          # gate G11 threshold (max rel. volume error)
    max_iter: 30
    centroidal_iterations: 0

crystal:
  space_group:
    number: 225              # Fm-3m
  lattice:
    a: 3.615                 # Cu, Å
  wyckoff_sites:
    - {element: Cu, coords: [0.0, 0.0, 0.0], letter: a}

orientation:
  scheme: random_uniform

boundaries:
  geometry: flat
  overlap_removal:
    enabled: true
    cutoff: "0.85*d_nn"
    policy: delete_shallower

analysis:
  voxel_grid: auto
  gb_character: true
  csl: false
  per_atom_margin: false

output:
  directory: ./out_cu_volume_list
  lammps:
    filename: polycrystal.data
    atom_style: molecular
  xyz:
    enabled: true
    filename: polycrystal.extxyz
  csv:
    grains: grains.csv
    boundaries: boundaries.csv
    vertices: vertices.csv
    summary: summary.csv
  gnuplot:
    enabled: true
  mesh:
    enabled: false
