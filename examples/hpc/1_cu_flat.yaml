# ===================== grainsmith run configuration =====================
# HPC tier 1/3: FCC Cu, 10 grains, 360³ Å, FLAT GBs (~4.0×10⁶ atoms).
#
# The examples/hpc/ trio is the cluster-scale (SLURM) counterpart of the
# laptop-sized groups: the same three boundary-geometry classes — flat
# (this file), curved/anisotropic (2_cu_curved.yaml) and self-affine
# fractal (3_cu_fractal.yaml) — at multi-million-atom production scale.
#
# WHAT THIS TEACHES
#   * grainsmith's parallel model on a cluster: ONE run = ONE node = ONE
#     task. All parallelism is worker processes inside that task
#     (--jobs); nothing spans nodes. Never ask SLURM for --nodes > 1 or
#     --ntasks > 1 — each extra task would run the FULL pipeline again
#     into the same output directory.
#   * The best-parallelism operating point on a single node:
#     --jobs = grains.number (here 10), with --cpus-per-task set to
#     match. The fill stage hands each grain its own worker process, so
#     all 10 grains fill simultaneously. More cores than grains speeds
#     up only the per-boundary-pair analysis stage; on fewer cores set
#     --jobs to the core count and workers pick grains up dynamically.
#   * --jobs 0 resolves to the cores AVAILABLE to the process (the
#     cgroup/affinity mask — i.e. your --cpus-per-task allocation), but
#     on shared nodes an explicit --jobs $SLURM_CPUS_PER_TASK is clearer.
#   * numba JIT warmup: every kernel is disk-cached (cache=True) inside
#     the venv on the shared filesystem — run any small example once
#     (e.g. examples/basics/b2_nial_flat.yaml) after installing and all
#     later jobs on every node skip compilation entirely.
#
# HOW TO RUN (workstation)
#   grainsmith validate examples/hpc/1_cu_flat.yaml
#   grainsmith generate examples/hpc/1_cu_flat.yaml --jobs 10
#
# HOW TO RUN (SLURM batch — single node, jobs == grains == 10)
#   #!/bin/bash
#   #SBATCH --partition=<partition>          # e.g. orfoz on TRUBA
#   #SBATCH --nodes=1 --ntasks=1 --cpus-per-task=10
#   export OMP_NUM_THREADS=1
#   grainsmith generate examples/hpc/1_cu_flat.yaml --jobs $SLURM_CPUS_PER_TASK
#
# HOW TO RUN (interactive salloc)
#   salloc -N 1 -n 1 -c 10 -p <partition>
#   srun grainsmith generate examples/hpc/1_cu_flat.yaml --jobs 10
#
# Full cluster guide (setup + warm-up, sbatch template job.sbatch, salloc
# caveats, job arrays, pitfalls): examples/hpc/README.md

meta:
  title: "FCC Cu, 10 grains, 360³ Å, flat GBs (HPC baseline)"
  verbose: 1

seed:
  mode: fixed
  value: 282930

box:
  lengths: [360.0, 360.0, 360.0]
  periodic: [true, true, true]
  vacuum: 0.0

grains:
  number: 10                 # == the recommended --jobs (see header)
  min_seed_distance: auto
  lloyd_iterations: 0

crystal:
  space_group:
    number: 225              # Fm-3m
  lattice:
    a: 3.615                 # Cu, Å
  wyckoff_sites:
    - {element: Cu, coords: [0.0, 0.0, 0.0], letter: a}

orientation:
  scheme: random_uniform

boundaries:
  geometry: flat
  overlap_removal:
    enabled: true
    cutoff: "0.85*d_nn"
    policy: delete_shallower

analysis:
  voxel_grid: auto
  gb_character: true
  csl: false
  per_atom_margin: false

output:
  directory: ./out_hpc_cu_flat
  lammps:
    filename: polycrystal.data
    atom_style: molecular
  xyz:
    enabled: true
    filename: polycrystal.extxyz
  csv:
    grains: grains.csv
    boundaries: boundaries.csv
    vertices: vertices.csv
    summary: summary.csv
  gnuplot:
    enabled: true
  mesh:
    enabled: false
